name: Build Enclava image

on:
  pull_request:
    paths:
      - 'Dockerfile.enclava'
      - 'docker/**'
      - 'gateway/**'
      - 'agent/**'
      - 'hermes_cli/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/enclava-build.yml'
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag label used in generated policy filename (defaults to git ref name)"
        required: false
        type: string

env:
  IMAGE_NAME: hermes-agent-enclava
  REGISTRY: ghcr.io
  POLICY_BASENAME: hermes-agent-attestation-policy

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=long,prefix=sha-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.enclava
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Image pushed successfully"
          echo "Tags: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"

      - name: Smoke test PR image
        if: github.event_name == 'pull_request'
        run: |
          set -euo pipefail
          IMAGE_TAG="$(printf '%s\n' '${{ steps.meta.outputs.tags }}' | head -n1)"
          docker run --rm -d --name hermes-enclava-smoke \
            -p 18000:8000 \
            -e HERMES_HOME=/state/data \
            -e HERMES_DASHBOARD_AUTH_TOKEN=test-dashboard-secret \
            -e HERMES_INFERENCE_PROVIDER=openrouter \
            -e HERMES_INFERENCE_MODEL=openai/gpt-4o-mini \
            "$IMAGE_TAG"
          trap 'docker rm -f hermes-enclava-smoke >/dev/null 2>&1 || true' EXIT
          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:18000/health >/dev/null; then
              test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/)" = "401"
              curl -fsS "http://127.0.0.1:18000/?dashboard_token=test-dashboard-secret" >/dev/null
              API_PREFIX="/v1"
              test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18000${API_PREFIX}/models")" = "404"
              exit 0
            fi
            sleep 1
          done
          docker logs hermes-enclava-smoke
          exit 1

      - name: Resolve policy metadata
        if: github.event_name != 'pull_request'
        id: policy_meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.image_tag }}" ]; then
            IMAGE_TAG="${{ github.event.inputs.image_tag }}"
          else
            IMAGE_TAG="${GITHUB_REF_NAME}"
          fi
          SAFE_IMAGE_TAG="$(printf '%s' "${IMAGE_TAG}" | sed -E 's/[^A-Za-z0-9._-]+/-/g')"
          IMAGE_REF="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"
          POLICY_FILE="${{ env.POLICY_BASENAME }}-${SAFE_IMAGE_TAG}.json"
          echo "image_tag=${SAFE_IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_tag_original=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "image_ref=${IMAGE_REF}" >> "$GITHUB_OUTPUT"
          echo "policy_file=${POLICY_FILE}" >> "$GITHUB_OUTPUT"

      - name: Generate attestation policy
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          mkdir -p dist/attestation
          python3 .github/scripts/generate_attestation_policy.py \
            --output "dist/attestation/${{ steps.policy_meta.outputs.policy_file }}" \
            --workload-image "${{ steps.policy_meta.outputs.image_ref }}" \
            --source-ref "${GITHUB_REF}" \
            --image-tag "${{ steps.policy_meta.outputs.image_tag_original }}"

      - name: Generate checksums
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cd dist/attestation
          sha256sum "${{ steps.policy_meta.outputs.policy_file }}" > "${{ steps.policy_meta.outputs.policy_file }}.sha256"

      - name: Install Cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Cosign sign image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          cosign sign --yes "${{ steps.policy_meta.outputs.image_ref }}"

      - name: Keyless sign attestation policy
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          POLICY_PATH="dist/attestation/${{ steps.policy_meta.outputs.policy_file }}"
          BUNDLE_PATH="${POLICY_PATH}.sigstore.json"
          cosign sign-blob --yes --bundle "${BUNDLE_PATH}" "${POLICY_PATH}"

      - name: Write verification hints
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          POLICY_PATH="dist/attestation/${{ steps.policy_meta.outputs.policy_file }}"
          printf '%s\n' \
            "cosign verify-blob \\" \
            "  --bundle \"${{ steps.policy_meta.outputs.policy_file }}.sigstore.json\" \\" \
            "  --certificate-identity \"https://github.com/${GITHUB_REPOSITORY}/.github/workflows/enclava-build.yml@${GITHUB_REF}\" \\" \
            "  --certificate-oidc-issuer \"https://token.actions.githubusercontent.com\" \\" \
            "  \"${{ steps.policy_meta.outputs.policy_file }}\"" \
            > "${POLICY_PATH}.verify.txt"

      - name: Upload policy artifacts
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: attestation-policy-${{ steps.policy_meta.outputs.image_tag }}
          path: dist/attestation/*
          if-no-files-found: error

      - name: Attach policy assets to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/attestation/${{ steps.policy_meta.outputs.policy_file }}
            dist/attestation/${{ steps.policy_meta.outputs.policy_file }}.sha256
            dist/attestation/${{ steps.policy_meta.outputs.policy_file }}.sigstore.json
            dist/attestation/${{ steps.policy_meta.outputs.policy_file }}.verify.txt
